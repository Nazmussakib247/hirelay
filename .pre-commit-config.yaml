# Pre-commit hooks — run `pre-commit install` once, then checks run on git commit.
# See https://pre-commit.com
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies: ["pydantic>=2"]

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: bash -c 'command -v gitleaks >/dev/null && gitleaks protect --staged --no-banner || echo "gitleaks not installed — skipping"'
        language: system
        pass_filenames: false
